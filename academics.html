<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Scholars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/academics.css">
  <link rel="icon" type="images/jpeg" href="assets/images/logo.png.jpeg">
</head>
<body>

    <!-- Nav -->
<nav>
  <div class="nav-inner">
    <a href="#" class="nav-logo">
      <div class="nav-logo-icon">
        <img src="assets/images/logo.png.jpeg" alt="Little Scholars logo">
      </div>
      <div class="nav-logo-text"><strong>Little Scholars</strong></div>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul id="navMenu">
      <li><a href="index.html" class="active">Home</a></li>
      <li><a href="about.html" class="active">About</a></li>
      <li><a href="academics.html" class="active">Academics</a></li>
      <li><a href="admission.html" class="active">Admission</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="news.html" class="active">News</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
      <li><a href="login.html" class="active">Login</a></li>

    </ul>
  </div>
</nav>


<script>
    // Mobile nav toggle
  const navToggle = document.getElementById('navToggle');
  const navMenu = document.getElementById('navMenu');

  navToggle.addEventListener('click', () => {
    const isOpen = navMenu.classList.toggle('open');
    navToggle.classList.toggle('open', isOpen);
    navToggle.setAttribute('aria-expanded', isOpen);
  });

  navMenu.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navMenu.classList.remove('open');
      navToggle.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>
</body>
</html>
